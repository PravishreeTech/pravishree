<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 200 190 fill=none>
  <defs>
    <linearGradient id=cloverGradStacked x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#00B4D8/>
      <stop offset=50% stop-color=#0096C7/>
      <stop offset=100% stop-color=#0077B6/>
    </linearGradient>
    <linearGradient id=peelGradStacked x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#FFFFFF/>
      <stop offset=100% stop-color=#CAF0F8/>
    </linearGradient>
    <filter id=subtleShadowStacked x=-10% y=-10% width=130% height=130%>
      <feDropShadow dx=0 dy=2 stdDeviation=2 flood-color=#0077B6 flood-opacity=0.12/>
    </filter>
  </defs>

  <!-- Clover Crest Icon Centered -->
  <g transform=translate(60, 10) filter=url(#subtleShadowStacked)>
    <!-- Main Clover Body -->
    <path d=M 40,24 C 36,13 22,12 16,22 C 10,32 20,44 32,44 C 20,44 10,56 16,66 C 22,76 36,75 40,64 C 44,75 58,76 64,66 C 70,56 60,44 48,44 C 60,44 70,32 64,22 C 58,12 44,13 40,24 Z fill=url(#cloverGradStacked)/>
    <!-- Stem -->
    <path d=M 37,56 C 36,68 30,76 22,80 L 58,80 C 50,76 44,68 43,56 Z fill=url(#cloverGradStacked)/>
    <!-- Peel / Fold effect on top-left petal -->
    <path d=M 22,16 C 26,14 31,16 35,20 C 30,22 25,27 24,33 C 20,29 19,23 22,16 Z fill=url(#peelGradStacked) opacity=0.95/>
    <path d=M 22,16 C 26,20 28,26 24,33 C 21,30 20,23 22,16 Z fill=#0077B6 opacity=0.3/>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1=12 y1=124 x2=188 y2=124 stroke=#0096C7 stroke-width=2.5 stroke-linecap=round/>

  <!-- Brand Name Typography -->
  <text x=100 y=156 text-anchor=middle font-family='Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif font-size=19.5 font-weight=700 fill=#0B3B60 letter-spacing=-0.4>
    Pravishree Design Co.
  </text>
</svg>
