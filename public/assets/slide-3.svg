<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FAFD"/>
      <stop offset="60%" stop-color="#E8F4FA"/>
      <stop offset="100%" stop-color="#D7EEFA"/>
    </linearGradient>
    <linearGradient id="cyanGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FCFF"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#005B8E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad3)" rx="24"/>
  <circle cx="1050" cy="150" r="320" fill="#0096C7" opacity="0.07"/>
  <circle cx="150" cy="550" r="240" fill="#0077B6" opacity="0.05"/>

  <!-- Top Logo Banner -->
  <g transform="translate(60, 45)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#0B3B60">Pravishree Design Co.</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#0096C7" letter-spacing="1.5">A TECH SOLUTION FIRM</text>
    <line x1="0" y1="10" x2="210" y2="10" stroke="#0096C7" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 160)">
    <rect width="150" height="28" rx="14" fill="#E0F2FE"/>
    <text x="14" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0284C7" letter-spacing="1">GROWTH • ROI • SCALE</text>
    
    <text y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#0B3B60" line-height="1.2">
      <tspan x="0" dy="0">Digital Marketing &amp;</tspan>
      <tspan x="0" dy="54" fill="#0077B6">Brand Acceleration</tspan>
    </text>

    <text y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="400" fill="#475569">
      <tspan x="0" dy="0">Data-driven performance campaigns, search engine authority,</tspan>
      <tspan x="0" dy="26">and high-converting multi-channel funnel strategies.</tspan>
    </text>

    <!-- Key Metric Pills -->
    <g transform="translate(0, 270)">
      <rect width="160" height="50" rx="12" fill="#FFFFFF" filter="url(#shadow3)"/>
      <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">AVG ROI GROWTH</text>
      <text x="18" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0077B6">+280%</text>

      <rect x="180" width="160" height="50" rx="12" fill="#FFFFFF" filter="url(#shadow3)"/>
      <text x="198" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">CONVERSIONS</text>
      <text x="198" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0284C7">4.8x Higher</text>

      <rect x="360" width="160" height="50" rx="12" fill="#FFFFFF" filter="url(#shadow3)"/>
      <text x="378" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">GLOBAL AUDIENCE</text>
      <text x="378" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">15M+ Reached</text>
    </g>
  </g>

  <!-- Right Visual Graphics: Interactive Chart & Marketing Engine Dashboard -->
  <g transform="translate(680, 100)" filter="url(#shadow3)">
    <!-- Dashboard Card -->
    <rect width="450" height="420" rx="20" fill="url(#cardGrad3)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect x="25" y="25" width="14" height="14" rx="7" fill="#EF4444" opacity="0.7"/>
    <rect x="47" y="25" width="14" height="14" rx="7" fill="#F59E0B" opacity="0.7"/>
    <rect x="69" y="25" width="14" height="14" rx="7" fill="#10B981" opacity="0.7"/>
    <text x="100" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B">Performance Analytics Hub</text>

    <!-- Marketing Bars -->
    <g transform="translate(35, 70)">
      <rect width="380" height="150" rx="14" fill="#F1F8FC"/>
      <!-- Grid Lines -->
      <line x1="20" y1="30" x2="360" y2="30" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/>
      <line x1="20" y1="70" x2="360" y2="70" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/>
      <line x1="20" y1="110" x2="360" y2="110" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/>
      
      <!-- Growth Curve Area -->
      <path d="M 30,120 Q 100,105 160,80 T 260,45 T 350,20 L 350,140 L 30,140 Z" fill="url(#cyanGrad3)" opacity="0.2"/>
      <path d="M 30,120 Q 100,105 160,80 T 260,45 T 350,20" stroke="#0077B6" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <circle cx="160" cy="80" r="5" fill="#0096C7"/>
      <circle cx="260" cy="45" r="5" fill="#0096C7"/>
      <circle cx="350" cy="20" r="7" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Channel Cards -->
    <g transform="translate(35, 245)">
      <rect width="180" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="25" cy="35" r="14" fill="#E0F2FE"/>
      <text x="20" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0284C7">SEO</text>
      <text x="50" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0B3B60">Organic Reach</text>
      <text x="50" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#10B981">+340% Traffic</text>

      <rect x="200" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="225" cy="35" r="14" fill="#FEF3C7"/>
      <text x="219" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#D97706">ADS</text>
      <text x="250" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0B3B60">PPC Conversion</text>
      <text x="250" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0077B6">5.2x ROAS</text>

      <rect y="82" width="380" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0B3B60">Social &amp; Influencer Campaigns</text>
      <text x="20" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#64748B">Omnichannel targeted branding with precision tracking</text>
      <circle cx="340" cy="117" r="16" fill="#0077B6"/>
      <path d="M 334,117 L 346,117 M 340,111 L 346,117 L 340,123" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
