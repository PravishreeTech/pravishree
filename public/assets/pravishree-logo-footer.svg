<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 380 90 fill=none>
  <defs>
    <linearGradient id=cloverGradFooter x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#00D9FF/>
      <stop offset=50% stop-color=#0096C7/>
      <stop offset=100% stop-color=#0077B6/>
    </linearGradient>
    <linearGradient id=peelGradFooter x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#FFFFFF/>
      <stop offset=100% stop-color=#CAF0F8/>
    </linearGradient>
  </defs>

  <!-- Clover Crest Icon -->
  <g transform=translate(5, 5)>
    <!-- Main Clover Body -->
    <path d=M 40,24 C 36,13 22,12 16,22 C 10,32 20,44 32,44 C 20,44 10,56 16,66 C 22,76 36,75 40,64 C 44,75 58,76 64,66 C 70,56 60,44 48,44 C 60,44 70,32 64,22 C 58,12 44,13 40,24 Z fill=url(#cloverGradFooter)/>
    <!-- Stem -->
    <path d=M 37,56 C 36,68 30,76 22,80 L 58,80 C 50,76 44,68 43,56 Z fill=url(#cloverGradFooter)/>
    <!-- Peel / Fold effect on top-left petal -->
    <path d=M 22,16 C 26,14 31,16 35,20 C 30,22 25,27 24,33 C 20,29 19,23 22,16 Z fill=url(#peelGradFooter) opacity=0.95/>
    <path d=M 22,16 C 26,20 28,26 24,33 C 21,30 20,23 22,16 Z fill=#00D9FF opacity=0.4/>
  </g>

  <!-- Typography -->
  <g transform=translate(85, 12)>
    <!-- Main Brand Name -->
    <text x=0 y=32 font-family='Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif font-size=27 font-weight=700 fill=#FFFFFF letter-spacing=-0.5>
      Pravishree Design Co.
    </text>
    <!-- Underline Bar with accent dot -->
    <line x1=0 y1=41 x2=280 y2=41 stroke=#00D9FF stroke-width=2.2 stroke-linecap=round/>
    <circle cx=283 cy=41 r=2.2 fill=#00D9FF/>
    <!-- Tagline -->
    <text x=0 y=58 font-family='Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif font-size=14.5 font-weight=600 fill=#38BDF8 letter-spacing=1.2>
      A TECH SOLUTION FIRM
    </text>
  </g>
</svg>
