<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FAFD"/>
      <stop offset="60%" stop-color="#E8F4FA"/>
      <stop offset="100%" stop-color="#D7EEFA"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="studioGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3B60"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#005B8E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad2)" rx="24"/>
  <circle cx="1060" cy="140" r="320" fill="#0096C7" opacity="0.07"/>
  <circle cx="160" cy="540" r="240" fill="#0077B6" opacity="0.05"/>

  <!-- Top Logo Banner -->
  <g transform="translate(60, 45)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#0B3B60">Pravishree Design Co.</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#0096C7" letter-spacing="1.5">A TECH SOLUTION FIRM</text>
    <line x1="0" y1="10" x2="210" y2="10" stroke="#0096C7" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 160)">
    <rect width="245" height="28" rx="14" fill="#E0F2FE"/>
    <text x="14" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0284C7" letter-spacing="1">CREATIVE • VIDEO • BRANDING</text>
    
    <text y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#0B3B60" line-height="1.2">
      <tspan x="0" dy="0">Creative Designs &amp;</tspan>
      <tspan x="0" dy="54" fill="#0077B6">Stunning Visual Impact</tspan>
    </text>

    <text y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="400" fill="#475569">
      <tspan x="0" dy="0">We bring your ideas to life with high-converting creative designs,</tspan>
      <tspan x="0" dy="26">professional video editing, motion graphics, and digital brand identities.</tspan>
    </text>

    <!-- Key Metric Pills -->
    <g transform="translate(0, 270)">
      <rect width="160" height="50" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
      <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">CREATIVE ASSETS</text>
      <text x="18" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0077B6">1,200+ Delivered</text>

      <rect x="180" width="160" height="50" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
      <text x="198" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">ENGAGEMENT</text>
      <text x="198" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0284C7">3.4x Higher</text>

      <rect x="360" width="160" height="50" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
      <text x="378" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">VIDEO QUALITY</text>
      <text x="378" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">4K HDR Cinema</text>
    </g>
  </g>

  <!-- Right Visual Graphics: Creative Design Studio Dashboard -->
  <g transform="translate(680, 95)" filter="url(#shadow2)">
    <!-- Dashboard Card -->
    <rect width="450" height="430" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <g transform="translate(30, 25)">
      <rect width="36" height="36" rx="10" fill="#E0F2FE"/>
      <path d="M 12,18 L 24,18 M 18,12 L 18,24" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round"/>
      <text x="48" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0B3B60">Visual Production &amp; Video Suite</text>
      <text x="48" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#10B981">● High-Fidelity Rendering • 60 FPS Ready</text>
    </g>

    <!-- Visual Editor Timeline & Stages -->
    <g transform="translate(30, 75)">
      
      <!-- Timeline Workspace Preview -->
      <rect width="390" height="110" rx="12" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1.5"/>
      <g transform="translate(15, 12)">
        <text x="0" y="14" font-family="monospace" font-size="11" font-weight="700" fill="#0077B6">00:04:28:16</text>
        <rect x="300" y="2" width="60" height="16" rx="4" fill="#E0F2FE"/>
        <text x="308" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284C7">4K MASTER</text>

        <!-- Track 1: Video -->
        <rect y="25" width="360" height="22" rx="6" fill="#F1F5F9"/>
        <rect x="10" y="27" width="140" height="18" rx="4" fill="#0077B6"/>
        <text x="20" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Clip_A_ColorGrade.mp4</text>
        <rect x="160" y="27" width="180" height="18" rx="4" fill="#00D9FF"/>
        <text x="170" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#061329">Motion_GFX_Overlay.mov</text>

        <!-- Track 2: Audio Waves -->
        <rect y="54" width="360" height="20" rx="6" fill="#F1F5F9"/>
        <path d="M 10,64 Q 30,58 50,64 T 90,64 T 130,56 T 170,64 T 210,58 T 250,64 T 290,56 T 330,64" stroke="#0F766E" stroke-width="2.5" fill="none"/>
        <line x1="180" y1="20" x2="180" y2="80" stroke="#0077B6" stroke-width="2"/>
        <circle cx="180" cy="20" r="4" fill="#0077B6"/>
      </g>

      <!-- 4 Core Creative Modules -->
      <g transform="translate(0, 125)">
        <!-- Box 1 -->
        <rect width="185" height="75" rx="10" fill="#F8FAFC" stroke="#0096C7" stroke-width="1.2"/>
        <rect x="10" y="12" width="28" height="28" rx="8" fill="#E0F2FE"/>
        <text x="18" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0077B6">🎨</text>
        <text x="46" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0B3B60">Graphic Design</text>
        <text x="46" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#64748B">UI/UX &amp; Brand Systems</text>
        <text x="12" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284C7">Figma • Illustrator</text>

        <!-- Box 2 -->
        <rect x="205" width="185" height="75" rx="10" fill="#F8FAFC" stroke="#0096C7" stroke-width="1.2"/>
        <rect x="215" y="12" width="28" height="28" rx="8" fill="#E0F2FE"/>
        <text x="223" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0077B6">🎬</text>
        <text x="251" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0B3B60">Video Editing</text>
        <text x="251" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#64748B">Commercial &amp; Reels</text>
        <text x="217" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0077B6">Premiere • DaVinci</text>

        <!-- Box 3 -->
        <rect y="88" width="185" height="75" rx="10" fill="#F8FAFC" stroke="#0096C7" stroke-width="1.2"/>
        <rect x="10" y="100" width="28" height="28" rx="8" fill="#E0F2FE"/>
        <text x="18" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0284C7">✨</text>
        <text x="46" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0B3B60">Motion Graphics</text>
        <text x="46" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#64748B">2D/3D VFX &amp; Intros</text>
        <text x="12" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0F766E">After Effects • Cinema</text>

        <!-- Box 4 -->
        <rect x="205" y="88" width="185" height="75" rx="10" fill="#F8FAFC" stroke="#0096C7" stroke-width="1.2"/>
        <rect x="215" y="100" width="28" height="28" rx="8" fill="#E0F2FE"/>
        <text x="223" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F766E">💎</text>
        <text x="251" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0B3B60">Visual Identity</text>
        <text x="251" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#64748B">Logo, Guidelines &amp; Ads</text>
        <text x="217" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284C7">Photoshop • Branding</text>
      </g>

      <!-- Bottom Platform Strip -->
      <g transform="translate(0, 290)">
        <rect width="390" height="42" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
        <text x="14" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369A1">STUDIO TOOLS:</text>
        <rect x="105" y="10" width="55" height="22" rx="6" fill="#0077B6"/>
        <text x="115" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Premiere</text>
        <rect x="166" y="10" width="60" height="22" rx="6" fill="#0096C7"/>
        <text x="176" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">AfterFx</text>
        <rect x="232" y="10" width="55" height="22" rx="6" fill="#0284C7"/>
        <text x="242" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">DaVinci</text>
        <rect x="293" y="10" width="85" height="22" rx="6" fill="#0F766E"/>
        <text x="303" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Photoshop / Ai</text>
      </g>
    </g>
  </g>
</svg>
