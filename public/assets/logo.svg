<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="cloverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#0096C7"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="peelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CAF0F8"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0077B6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clover Crest Icon -->
  <g transform="translate(5, 5)" filter="url(#subtleShadow)">
    <!-- Main Clover Body -->
    <path d="M 40,24 C 36,13 22,12 16,22 C 10,32 20,44 32,44 C 20,44 10,56 16,66 C 22,76 36,75 40,64 C 44,75 58,76 64,66 C 70,56 60,44 48,44 C 60,44 70,32 64,22 C 58,12 44,13 40,24 Z" fill="url(#cloverGrad)"/>
    <!-- Stem -->
    <path d="M 37,56 C 36,68 30,76 22,80 L 58,80 C 50,76 44,68 43,56 Z" fill="url(#cloverGrad)"/>
    <!-- Peel / Fold effect on top-left petal -->
    <path d="M 22,16 C 26,14 31,16 35,20 C 30,22 25,27 24,33 C 20,29 19,23 22,16 Z" fill="url(#peelGrad)" opacity="0.95"/>
    <path d="M 22,16 C 26,20 28,26 24,33 C 21,30 20,23 22,16 Z" fill="#0077B6" opacity="0.3"/>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 12)">
    <!-- Main Brand Name -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif" font-size="27" font-weight="700" fill="#0B3B60" letter-spacing="-0.5">
      Pravishree Design Co.
    </text>
    <!-- Underline Bar with accent dot -->
    <line x1="0" y1="41" x2="280" y2="41" stroke="#0096C7" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="283" cy="41" r="2.2" fill="#0096C7"/>
    <!-- Tagline -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="500" fill="#0F4C81" letter-spacing="1.2">
      A TECH SOLUTION FIRM
    </text>
  </g>
</svg>
